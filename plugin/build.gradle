// DIAL Core's plugin: the provider module served through DIAL Core's in-process plugin API. DIAL Core provides
// the plugin API, Vert.x, Netty, Jackson and SLF4J at run time; pluginJar writes the one fat jar for its plugins directory.
plugins {
    id 'com.gradleup.shadow' version '9.6.1'
}

evaluationDependsOn(':provider') // its test helpers (MockUpstream)

// The plugin API is published by ai-dial-core to its GitHub Packages Maven registry, which asks for a token with the
// read:packages scope even for a public package: GPR_USERNAME and GPR_PASSWORD, or gpr.user and gpr.key in
// ~/.gradle/gradle.properties. The version is pinned in gradle.properties (a plugin jar is built for one DIAL Core version).
repositories {
    maven {
        name = 'AiDialCoreGitHubPackages'
        url = uri('https://maven.pkg.github.com/epam/ai-dial-core')
        credentials {
            username = providers.gradleProperty('gpr.user').orElse(providers.environmentVariable('GPR_USERNAME')).orNull
            password = providers.gradleProperty('gpr.key').orElse(providers.environmentVariable('GPR_PASSWORD')).orNull
        }
        content {
            includeGroup 'com.epam.aidial'
        }
    }
}

def pluginApi = "com.epam.aidial:aidial-core-plugin-api:${plugin_api_version}"

dependencies {
    compileOnly pluginApi
    compileOnly "com.fasterxml.jackson.core:jackson-databind:${jackson_core_version}"
    compileOnly "org.slf4j:slf4j-api:${slf4j_version}"
    implementation project(':provider')
    // The settings' JSON Schemas come from the settings' Jackson models; Jackson itself is DIAL Core's.
    implementation "com.github.victools:jsonschema-generator:${victools_jsonschema_version}"
    implementation "com.github.victools:jsonschema-module-jackson:${victools_jsonschema_version}"

    testImplementation pluginApi
    testImplementation "com.fasterxml.jackson.core:jackson-databind:${jackson_core_version}"
    testImplementation "com.networknt:json-schema-validator:${networknt_json_schema_validator_version}"
    testImplementation rootProject.project(':provider').sourceSets.test.output
    // The HTTP cases' runner (provider's test output) reads them
    testImplementation "org.yaml:snakeyaml:${snakeyaml_version}"
}

// What crosses the plugin API, the logging API and the telemetry API: DIAL Core's own copies must be the ones loaded.
// Of Jackson only what DIAL Core is known to ship (core, databind, annotations, the YAML format) is left out: the SDKs'
// JSON mapper also needs the Kotlin, JDK 8 and JSR-310 modules, which the plugin carries itself.
def bundledJackson = ['jackson-module-kotlin', 'jackson-datatype-jdk8', 'jackson-datatype-jsr310']
def providedByCore = { dependency ->
    String group = dependency.moduleGroup
    group in ['io.vertx', 'io.netty', 'org.slf4j', 'io.opentelemetry']
            || (group.startsWith('com.fasterxml.jackson') && !(dependency.moduleName in bundledJackson))
}

// One jar with everything the plugin needs of its own (the provider module and its dependencies, the META-INF/services
// files merged) and nothing DIAL Core provides. DIAL Core loads the jars of its plugins directory through one class loader.
// Nothing is relocated: the plugin's classes share that loader with the other plugins' jars.
tasks.register('pluginJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    description = "Builds the fat jar for DIAL Core's plugins directory."
    group = 'build'
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
    dependencies {
        exclude { providedByCore(it) }
    }
    // The merge sees every copy of a service file only when duplicates of it are included (Shadow 9 drops them first).
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()
    // Some bundled libraries keep classes of newer Java versions in META-INF/versions: the JVM reads them only for this attribute.
    manifest {
        attributes 'Multi-Release': 'true'
    }
    // The signatures of the merged jars (Azure's MSFTSIG) do not hold for the merged jar, and one module descriptor is wrong for it.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/MSFTSIG.*'
    exclude 'module-info.class', 'META-INF/versions/*/module-info.class'
    // The SDKs' generated models are tens of thousands of classes: more entries than a plain zip holds (65535).
    zip64 = true
    archiveBaseName = 'aidial-model-provider-plugin'
    archiveClassifier = ''
    destinationDirectory = layout.buildDirectory.dir('plugins')
}

// The Shadow plugin's own shadowJar (part of assemble, so of build) would pack the same classes without pluginJar's
// exclusions, and fails on the 65535 entries limit: pluginJar is the plugin's jar.
tasks.named('shadowJar') {
    enabled = false
}

// PluginJarIsolationTest loads the jar the way DIAL Core does, so the test needs the built jar.
tasks.named('test') {
    dependsOn tasks.named('pluginJar')
    systemProperty 'plugin.jar', tasks.named('pluginJar').get().archiveFile.get().asFile.absolutePath
}
