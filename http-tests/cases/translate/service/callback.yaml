# What only the service does: the call back to DIAL Core, and the paths it serves.
---
name: "service: the model of the call back is the deployment, whatever the request says"
request: {headers: {X-DIAL-OVERRIDE-NAME: other}, json: {model: another-model}}
---
name: "service: only the key, the cache policy and the upstream pin go back to DIAL Core"
request:
  headers:
    x-dial-cache-policy: 'no-store'
    x-upstream-id: 'u-1'
    authorization: Bearer other
    x-upstream-endpoint: 'http://h.invalid/v1/responses'
    x-upstream-key: k
    x-dial-cache-breakpoint-path: 'prefix.body.messages[0].content[0]'
    x-request-id: abc
mocks:
- request:
    headers:
      api-key: dk
      x-dial-cache-policy: 'no-store'
      x-upstream-id: 'u-1'
      authorization: {$absent: true}
      x-upstream-endpoint: {$absent: true}
      x-upstream-key: {$absent: true}
      x-dial-cache-breakpoint-path: {$absent: true}
      x-request-id: {$absent: true}
expect: {headers: {x-dial-cache-breakpoint-path: {$absent: true}, x-dial-cache-expire-at: {$absent: true}}}
---
name: "service: without DIAL_URL the call fails, and nothing is called"
server: {env: {DIAL_URL: !delete }}
mocks: []
expect: {status: 500, json: !replace {type: error, error: {type: api_error, message: Internal server error}}}
---
name: "service: DIAL Core that cannot be reached is a 502"
server: {env: {DIAL_URL: 'http://127.0.0.1:1'}}
mocks: []
expect: {status: 502, json: !replace {type: error, error: {type: api_error, message: Failed to reach DIAL Core}}}
---
name: "service: a stream request calls back for a stream"
request: {json: {stream: true}}
mocks:
- request: {json: {stream: true}}
  response:
    headers: {Content-Type: text/event-stream}
    json: !delete
    sse: {events: [{event: response.completed, json: {type: response.completed, response: {id: resp_1, status: completed, output: [], usage: {input_tokens: 1, output_tokens: 1, total_tokens: 2}}}}]}
expect:
  headers: {content-type: {$regex: '^text/event-stream'}}
  json: !delete
  sse:
    events:
    - event: message_start
      json: {$partial: {type: message_start}}
    - event: content_block_start
      json: {$partial: {type: content_block_start}}
    - event: content_block_stop
      json: {type: content_block_stop, index: 0}
    - event: message_delta
      json: {$partial: {type: message_delta}}
    - event: message_stop
      json: {type: message_stop}
---
name: "service: count_tokens is an unknown endpoint"
request: {path: /openaiResponses/anthropic/v1/messages/count_tokens}
mocks: []
expect: {status: 404, json: !replace {type: error, error: {type: not_found_error, message: 'Unknown endpoint: /anthropic/v1/messages/count_tokens'}}}
---
name: "service: another path is an unknown endpoint"
request: {path: /openaiResponses/openai/v1/responses}
mocks: []
expect: {status: 404, json: !replace {type: error, error: {type: not_found_error, message: 'Unknown endpoint: /openai/v1/responses'}}}
---
name: "service: the root is an unknown endpoint"
request: {path: /openaiResponses/}
mocks: []
expect: {status: 404, json: !replace {type: error, error: {type: not_found_error, message: 'Unknown endpoint: /'}}}
---
name: "service: a method other than POST is an unknown endpoint"
request: {method: GET, json: !delete }
mocks: []
expect: {status: 404, json: !replace {type: error, error: {type: not_found_error, message: 'Unknown endpoint: /anthropic/v1/messages'}}}
