# The default exchange of the Responses routes (/openai/v1/responses): a
# create request forwarded as received, with the key as a bearer token, and the upstream's answer as it came.
request:
  method: POST
  path: /openai/v1/responses
  body: '{"model":"gpt-5","input":"hi"}'
mocks:
- server: upstream
  request:
    method: POST
    path: /v1/responses
    headers: {authorization: Bearer k}
    body: '{"model":"gpt-5","input":"hi"}'
  response:
    status: 200
    headers: {Content-Type: application/json}
    body: '{"id":"resp_1"}'
expect: {status: 200, body: '{"id":"resp_1"}'}
