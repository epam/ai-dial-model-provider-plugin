# The answer of the upstream: the message the client gets.
---
name: text
---
name: the message is named by the deployment, not by the request
request: {headers: {X-DIAL-OVERRIDE-NAME: other}, json: {model: another-model}}
mocks: [{request: {json: {model: another-model}}}]
expect: {json: {model: gpt-5.5}}
---
name: output texts are text blocks, in order
mocks:
- response:
    json:
      output:
      - {type: message, id: m1, role: assistant, status: completed, content: [{type: output_text, text: One, annotations: []}, {type: output_text, text: Two, annotations: []}]}
expect: {json: {content: [{type: text, text: One}, {type: text, text: Two}]}}
---
name: no output is one empty text block
mocks: [{response: {json: {output: !replace []}}}]
expect: {json: {content: [{type: text, text: ''}]}}
---
name: an output item the translator does not know is dropped
mocks:
- response:
    json:
      output:
      - {type: future_item, id: f1}
      - {type: message, id: m1, role: assistant, status: completed, content: [{type: output_text, text: Hello, annotations: []}]}
---
name: a content part the translator does not know is dropped
mocks:
- response:
    json:
      output:
      - {type: message, id: m1, role: assistant, status: completed, content: [{type: future_part, a: 1}, {type: output_text, text: Hello, annotations: []}]}
---
name: usage is the tokens of the response
mocks: [{response: {json: {usage: {input_tokens: 7, output_tokens: 3}}}}]
expect: {json: {usage: {input_tokens: 7, output_tokens: 3}}}
---
name: no usage is zero tokens
mocks: [{response: {json: {usage: !delete }}}]
expect: {json: {usage: {input_tokens: 0, output_tokens: 0}}}
---
name: refusal is a text block
mocks:
- response:
    json:
      output:
      - {type: message, id: m1, role: assistant, status: completed, content: [{type: refusal, refusal: I cannot}]}
expect: {json: {content: [{type: text, text: I cannot}]}}
