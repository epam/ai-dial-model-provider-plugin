# What the translator lets pass: the Responses API has more than it reads.
---
name: status of a value the translator does not know does not fail the answer
mocks: [{response: {json: {status: future_status}}}]
---
name: fields the translator never reads are not checked
mocks:
- response:
    json:
      created_at: yesterday
      parallel_tool_calls: maybe
      temperature: warm
      metadata: 5
      extra: {a: 1}
---
name: fields of an item the translator never reads are not checked
mocks:
- response:
    json:
      output: !replace
      - {type: message, id: m1, role: assistant, status: weird, phase: {a: 1}, content: [{type: output_text, text: Hello, annotations: [], logprobs: nope}]}
---
name: item without a type is not an item
mocks: [{response: {json: {output: !replace [{id: m1}]}}}]
expect: {status: 500, json: !replace {type: error, error: {type: api_error, message: Internal server error}}}
---
name: content part without a type is not a part
mocks: [{response: {json: {output: !replace [{type: message, id: m1, role: assistant, status: completed, content: [{text: Hello}]}]}}}]
expect: {status: 500, json: !replace {type: error, error: {type: api_error, message: Internal server error}}}
