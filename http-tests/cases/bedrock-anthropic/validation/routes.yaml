# Routes below the bedrock mount: only POST messages and count_tokens are served.
---
name: GET on messages is a 405
request: {method: GET, path: /anthropic/v1/messages, body: !delete }
mocks: []
expect: {status: 405, headers: {allow: POST}, json: {detail: Method Not Allowed}}
---
name: batches are not served
request: {path: /anthropic/v1/messages/batches}
mocks: []
expect: {status: 404, json: {detail: Not Found}}
---
name: the Messages facade of the chat completions is not served
request: {path: /openaiChatCompletions/anthropic/v1/messages}
mocks: []
expect: {status: 404, json: {detail: Not Found}}
