# Streaming through a Messages API provider: the SSE comes back event by event, unchanged.
---
name: provider stream
request:
  body: '{"model":"claude-x","stream":true,"max_tokens":5,"messages":[{"role":"user","content":"hi"}]}'
mocks:
- request: {body: '{"model":"claude-x","stream":true,"max_tokens":5,"messages":[{"role":"user","content":"hi"}]}'}
  response:
    headers: {Content-Type: text/event-stream}
    body: !delete
    sse: {events: !ref /_lib/anthropic-stream.yaml:events}
expect:
  headers: {content-type: {$regex: '^text/event-stream'}}
  body: !delete
  sse:
    events: !ref /_lib/anthropic-stream.yaml:events
    termination: complete
    aggregate:
    - {type: concat, path: delta.text, equals: Hello}
---
name: provider stream relays an error event the model sent mid-stream
request:
  body: '{"model":"claude-x","stream":true,"messages":[]}'
mocks:
- request: {body: '{"model":"claude-x","stream":true,"messages":[]}'}
  response:
    headers: {Content-Type: text/event-stream}
    body: !delete
    sse:
      events:
      - {event: message_start, json: {type: message_start, message: {id: msg_1}}}
      - {event: error, json: !ref /_lib/anthropic-stream.yaml:overloaded}
expect:
  headers: {content-type: text/event-stream}
  body: !delete
  sse: !replace
    events:
    - {event: message_start, json: {type: message_start, message: {id: msg_1}}}
    - {event: error, json: {type: error, error: {type: overloaded_error, message: Overloaded}}}
---
name: provider stream carries the cache affinity headers
request:
  body: '{"model":"claude-x","stream":true,"messages":[{"role":"user","content":[{"type":"text","text":"hi","cache_control":{"type":"ephemeral"}}]}]}'
mocks:
- request: {body: '{"model":"claude-x","stream":true,"messages":[{"role":"user","content":[{"type":"text","text":"hi","cache_control":{"type":"ephemeral"}}]}]}'}
  response:
    headers: {Content-Type: text/event-stream}
    body: !delete
    sse: {events: [{event: message_stop, json: {type: message_stop}}]}
expect:
  headers: {content-type: text/event-stream, x-dial-cache-breakpoint-path: 'prefix.body.messages[0].content[0]', x-dial-cache-expire-at: '1300'}
  body: !delete
  sse: !replace {events: [{event: message_stop, json: {type: message_stop}}]}
---
name: provider stream answered with an error is not a stream
request:
  body: '{"model":"claude-x","stream":true,"messages":[]}'
mocks:
- request: {body: '{"model":"claude-x","stream":true,"messages":[]}'}
  response:
    status: 429
    headers: {Content-Type: application/json, Retry-After: '7'}
    json: !ref /_lib/anthropic-stream.yaml:overloaded
expect:
  status: 429
  headers: {content-type: application/json, retry-after: '7'}
  body: !delete
  json: {type: error, error: {type: overloaded_error, message: Overloaded}}
