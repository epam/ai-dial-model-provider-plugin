# What every case of this suite inherits (http-tests/README.md, bases): the bedrock adapter's Anthropic Messages API
# routes. The default exchange is the Bedrock invoke-model API ("legacy" client) in us-east-1, signed with the stubbed
# default-chain key AKID: the model and stream flag move into the URL, anthropic_version is added, the answer is
# relayed as it came.
server:
  env:
    AWS_DEFAULT_REGION: us-east-1
    ANTHROPIC_BEDROCK_BASE_URL: '${mocks.upstream.url}/bedrock'
    ANTHROPIC_BEDROCK_MANTLE_BASE_URL: '${mocks.upstream.url}/mantle'
    ANTHROPIC_BASE_URL: '${mocks.upstream.url}/platform'
  stubs: {now_seconds: 1000, aws_access_key_id: AKID}
request:
  method: POST
  path: /anthropic/v1/messages
  headers: {Content-Type: application/json}
  body: '{"model":"anthropic.claude-x","max_tokens":5,"messages":[{"role":"user","content":"hi"}]}'
mocks:
- server: upstream
  request:
    method: POST
    path: /bedrock/model/anthropic.claude-x/invoke
    headers: {content-type: application/json, accept: application/json, accept-encoding: {$absent: true}}
    body: '{"max_tokens":5,"messages":[{"role":"user","content":"hi"}],"anthropic_version":"bedrock-2023-05-31"}'
  response:
    status: 200
    headers: {Content-Type: application/json}
    body: '{"id":"msg_1","type":"message","role":"assistant","content":[{"type":"text","text":"Hello"}]}'
expect:
  status: 200
  headers: {content-type: application/json}
  body: '{"id":"msg_1","type":"message","role":"assistant","content":[{"type":"text","text":"Hello"}]}'
