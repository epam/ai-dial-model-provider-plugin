org.gradle.parallel=true

# Alphabetically sorted. Versions are ai-dial-core's (gradle.properties there): the provider module is embedded into
# Core's process, so it must resolve to the same Vert.x, Netty and Jackson.
aws_sdk_v2_version=2.46.8
azure_version=1.18.2
google_auth_version=1.23.0
jackson_core_version=2.21.7
# Nullness annotations only (no runtime code); the version Guava already brings.
jspecify_version=1.0.1
junit_version=5.14.4
logback_version=1.5.36
logstash_logback_version=7.4
netty_version=4.2.18.Final
opentelemetry_version=1.67.0
# The DIAL Core plugin API the plugin module compiles against (com.epam.aidial:aidial-core-plugin-api): the version of
# DIAL Core the plugin jar is built for. A snapshot for now.
plugin_api_version=0.51.0-SNAPSHOT
reactor_core_version=3.8.7
reactor_netty_http_version=1.3.7
slf4j_version=2.0.9
# The declarative HTTP test runner's YAML reader (tests only).
snakeyaml_version=2.5
vertx_version=4.5.35
# Pinned as ai-dial-core pins them (Trivy HIGH in the versions that come transitively: google-auth's guava, the AWS
# SDK's apache5-client).
guava_version=33.7.2-jre
apache_httpcore5_version=5.4.3
apache_httpclient5_version=5.6.4
