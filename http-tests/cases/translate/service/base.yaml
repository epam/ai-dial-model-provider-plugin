# What every case of this mode inherits (http-tests/README.md, bases): the translator as a service of DIAL Core, at
# /openaiResponses (the path DIAL Core calls it at), which calls DIAL Core back, with the caller's key, for the
# Responses API. DIAL Core is the mock "upstream" at DIAL_URL. The default exchange is the one of the adapter mode: "hi"
# asked, "Hello" answered; the model of the call back is the deployment's. The scenarios are in _scenarios, and run in
# every mode.
server:
  env: {DIAL_URL: '${mocks.upstream.url}'}
  stubs: {now_seconds: 1000}
options: {json_member_order: any}
request:
  method: POST
  path: /openaiResponses/anthropic/v1/messages
  headers:
    Content-Type: application/json
    api-key: dk
    X-DIAL-DEPLOYMENT-ID: gpt-5.5
  json:
    model: claude-x
    max_tokens: 100
    messages: [{role: user, content: hi}]
mocks:
- server: upstream
  request:
    method: POST
    path: /openai/v1/responses
    headers: {api-key: dk}
    json:
      model: gpt-5.5
      input: [{type: message, role: user, content: [{type: input_text, text: hi}]}]
      store: false
      include: [reasoning.encrypted_content]
      stream: false
      max_output_tokens: 100
  response:
    status: 200
    json:
      id: resp_1
      object: response
      status: completed
      output:
      - {type: message, id: msg_1, role: assistant, status: completed, content: [{type: output_text, text: Hello, annotations: []}]}
      usage: {input_tokens: 10, output_tokens: 2, total_tokens: 12}
expect:
  status: 200
  headers: {content-type: application/json}
  json:
    id: resp_1
    type: message
    role: assistant
    model: gpt-5.5
    content: [{type: text, text: Hello}]
    stop_reason: end_turn
    usage: {input_tokens: 10, output_tokens: 2, cache_read_input_tokens: 0, cache_creation_input_tokens: 0, output_tokens_details: {thinking_tokens: 0}}
