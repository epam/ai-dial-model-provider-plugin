# A request whose upstream cannot be made from its headers and the settings is a plain-text 500, before the body is
# read and without a call; an endpoint the cloud lacks, a 404; a token that cannot be had, a 401.
---
name: extra data is not an object
request:
  headers: {X-Upstream-Extra-Data: '[]'}
  body: '{"model":'
---
name: extra data is not JSON
request:
  headers: {X-Upstream-Extra-Data: '{'}
---
name: region is not a string
request:
  headers: {X-Upstream-Extra-Data: '{"region":1,"project":"p"}'}
---
name: no project anywhere
server: {env: {GCP_PROJECT_ID: !delete }}
---
name: no region anywhere
server: {env: {GCP_DEFAULT_REGION: !delete }}
