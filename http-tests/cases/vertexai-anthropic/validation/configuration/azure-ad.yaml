# A request that needs an Azure AD token and cannot get one is a 401 without a call, a stream too.
---
name: azure ad token failure is a 401
server: {stubs: {azure_ad_error: boom}}
request:
  headers: {X-Upstream-Endpoint: '${mocks.upstream.url}/anthropic/v1/messages'}
mocks: []
expect:
  status: 401
  headers: {content-type: application/json}
  body: "{\"error\":{\"message\":\"Authentication failed\",\"type\":\"authentication_error\"},\"type\":\"error\"}\n"
---
name: azure ad token failure of a stream is a 401 too
server: {stubs: {azure_ad_error: boom}}
request:
  headers: {X-Upstream-Endpoint: '${mocks.upstream.url}/anthropic/v1/messages'}
  body: '{"model":"claude-x","stream":true,"messages":[]}'
mocks: []
expect:
  status: 401
  headers: {content-type: application/json}
  body: "{\"error\":{\"message\":\"Authentication failed\",\"type\":\"authentication_error\"},\"type\":\"error\"}\n"
